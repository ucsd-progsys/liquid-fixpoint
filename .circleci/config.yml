---
version: 2.1

# This CircleCI job is the only one testing liquid-fixpoint with the
# --interpreter flag.
jobs:
  test-interpreter-flag:
    machine:
      image: default
    steps:
      - run: sudo apt-get update && sudo DEBIAN_FRONTEND=noninteractive apt-get install -yq curl git ssh unzip wget libtinfo-dev gcc make
      - add_ssh_keys
      - run:
          name: Install z3-4.10.2
          command: |
            wget https://github.com/Z3Prover/z3/releases/download/z3-4.10.2/z3-4.10.2-x64-glibc-2.31.zip
            unzip z3-4.10.2-x64-glibc-2.31.zip
            rm -f z3-4.10.2-x64-glibc-2.31.zip
            sudo cp z3-4.10.2-x64-glibc-2.31/bin/z3 /usr/local/bin
            rm -rf z3-4.10.2-x64-glibc-2.31
            z3 --version
      - run:
          name: Install cvc5
          command: |
            wget https://github.com/cvc5/cvc5/releases/download/cvc5-1.2.1/cvc5-Linux-x86_64-static.zip
            unzip cvc5-Linux-x86_64-static.zip
            rm -f cvc5-Linux-x86_64-static.zip
            sudo cp cvc5-Linux-x86_64-static/bin/cvc5 /usr/local/bin
            rm -rf cvc5-Linux-x86_64-static
            cvc5 --version
      - checkout

      - run:
          name: List dependencies
          command: |
            wget -qO- https://get.haskellstack.org/ | sudo sh
            stack ls dependencies json | jq > stack-deps.json

      - restore_cache:
          keys:
            - stack-cache-v1-{{ checksum "stack-deps.json" }}
      - run:
          name: Dependencies
          command: |
            stack --no-terminal setup
            stack --no-terminal build -j2 liquid-fixpoint --only-dependencies --test --no-run-tests
      - save_cache:
          key: stack-cache-v1-{{ checksum "stack-deps.json" }}
          paths:
            - ~/.stack
            - ./.stack-work
      - run:
          name: Compile
          command: |
            stack --no-terminal build -j2 liquid-fixpoint --flag liquid-fixpoint:devel --test --no-run-tests
      - run:
          name: Test
          command: |
            mkdir -p /tmp/junit
            stack --no-terminal test -j2 liquid-fixpoint:test --flag liquid-fixpoint:devel --ta "--fixpoint-opts --interpreter" --test-arguments="--xml=/tmp/junit/main-test-results.xml"
            stack --no-terminal test -j2 liquid-fixpoint:test --flag liquid-fixpoint:devel --test-arguments="--xml=/tmp/junit/main-test-results-no-interpreter.xml"
            stack --no-terminal haddock --flag liquid-fixpoint:devel --test --no-run-tests --no-haddock-deps --haddock-arguments="--no-print-missing-docs"
            # mkdir -p $CIRCLE_TEST_REPORTS/tasty
            # cp -r tests/logs/cur $CIRCLE_TEST_REPORTS/tasty/log
      - run:
          name: Dist
          command: stack --no-terminal sdist

workflows:
   build:
     jobs:
      - test-interpreter-flag
